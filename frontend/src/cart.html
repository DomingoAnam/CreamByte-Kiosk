<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fff1ec" />
    <title>Your order · CreamByte</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/frontend/src/css/base.css" />
    <link
      rel="icon"
      type="image/png"
      href="/frontend/src/assets/creambyte-logo.png"
    />
    <link rel="stylesheet" href="/frontend/src/styles.css" />
    <link rel="stylesheet" href="/frontend/src/css/cart.css" />
    <script src="/frontend/src/app.js" defer></script>
  </head>
  <body data-page="cart">
    <header class="topbar">
      <a class="brand-link" href="/frontend/src/" aria-label="CreamByte home"
        ><img
          class="brand-mark"
          src="/frontend/src/assets/creambyte-logo.png"
          alt="CreamByte" /></a
      ><span class="language-pill"
        ><img
          class="language-icon"
          src="/frontend/src/assets/Globe.svg"
          alt="" />English<img
          class="language-caret"
          src="/frontend/src/assets/Dropdown.svg"
          alt=""
      /></span>
    </header>
    <main class="kiosk-main">
      <section class="panel cart-panel">
        <div class="cart-content">
          <div class="cart-heading">
            <h1>Your Order</h1>
            <span class="item-count" id="item-count"></span>
          </div>
          <div class="cart-items" id="cart-items"></div>
        </div>
        <div class="totals" id="cart-totals"></div>
        <div class="cart-actions">
          <a
            class="secondary-button"
            id="edit-order"
            href="/frontend/src/flavor.html"
            >Edit order</a
          >
          <div class="cart-actions-primary">
            <a
              class="secondary-button"
              id="add-another-order"
              href="/frontend/src/preference.html"
              >Add another order</a
            >
            <a
              class="primary-button"
              id="checkout"
              href="/frontend/src/payment.html"
              >Proceed to checkout <span aria-hidden="true">→</span></a
            >
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
