<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fff1ec" />
    <title>CreamByte Kiosk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/frontend/src/css/base.css" />
    <link
      rel="icon"
      type="image/png"
      href="/frontend/src/assets/creambyte-logo.png"
    />
    <link rel="stylesheet" href="/frontend/src/styles.css" />
    <link rel="stylesheet" href="/frontend/src/css/home.css" />
  </head>
  <body data-page="attract">
    <header class="topbar">
      <a class="brand-link" href="/frontend/src/" aria-label="CreamByte home"
        ><img
          class="brand-mark"
          src="/frontend/src/assets/creambyte-logo.png"
          alt="CreamByte" /></a
      ><span class="language-pill"
        ><img
          class="language-icon"
          src="/frontend/src/assets/Globe.svg"
          alt="" />English<img
          class="language-caret"
          src="/frontend/src/assets/Dropdown.svg"
          alt=""
      /></span>
    </header>
    <main class="kiosk-main">
      <section class="panel attract-panel">
        <div class="mascot-wrap">
          <span class="mascot-glow"></span
          ><img
            class="hero-mascot"
            id="attract-mascot"
            src="/frontend/src/assets/CreamByte%20Bunny%20Mascot.svg"
            alt="CreamByte bunny mascot"
          />
        </div>
        <div class="attract-featured">
          <h1 id="attract-title">Choco-Straw Twirl</h1>
          <p id="attract-tagline">Limited Edition · only a few scoops left!</p>
        </div>
        <p class="attract-banner">
          Earn rewards with every order — points on us!
        </p>
        <button
          class="primary-button attract-start"
          id="attract-start"
          type="button"
        >
          Tap to start
        </button>
      </section>
    </main>
  </body>
  <script src="/frontend/src/app.js"></script>
</html>
