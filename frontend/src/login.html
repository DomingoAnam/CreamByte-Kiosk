<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fff1ec" />
    <title>Member login · CreamByte</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/frontend/src/css/base.css" />
    <link
      rel="icon"
      type="image/png"
      href="/frontend/src/assets/creambyte-logo.png"
    />
    <link rel="stylesheet" href="/frontend/src/styles.css" />
    <link rel="stylesheet" href="/frontend/src/css/register.css" />
  </head>
  <body data-page="login">
    <header class="topbar">
      <a class="brand-link" href="/frontend/src/" aria-label="CreamByte home"
        ><img
          class="brand-mark"
          src="/frontend/src/assets/creambyte-logo.png"
          alt="CreamByte" /></a
      ><span class="language-pill"
        ><img
          class="language-icon"
          src="/frontend/src/assets/Globe.svg"
          alt="" />English<img
          class="language-caret"
          src="/frontend/src/assets/Dropdown.svg"
          alt=""
      /></span>
    </header>
    <main class="kiosk-main">
      <section class="panel form-panel">
        <a class="back-button" href="/frontend/src/" aria-label="Go back"
          ><img src="/frontend/src/assets/Back Button.svg" alt=""
        /></a>
        <img
          class="form-icon"
          src="/frontend/src/assets/CreamByte%20Bunny%20Mascot.svg"
          alt="CreamByte mascot"
        />
        <h1>Member Login</h1>
        <p class="panel-intro">
          Enter your Member ID and PIN to earn points with every order.
        </p>
        <div class="keypad" id="keypad">
          <div
            class="keypad-display"
            id="keypad-display"
            role="status"
            aria-live="polite"
          ></div>
          <div class="keypad-grid" id="keypad-grid">
            <button class="keypad-key" data-key="1" type="button">1</button>
            <button class="keypad-key" data-key="2" type="button">2</button>
            <button class="keypad-key" data-key="3" type="button">3</button>
            <button class="keypad-key" data-key="4" type="button">4</button>
            <button class="keypad-key" data-key="5" type="button">5</button>
            <button class="keypad-key" data-key="6" type="button">6</button>
            <button class="keypad-key" data-key="7" type="button">7</button>
            <button class="keypad-key" data-key="8" type="button">8</button>
            <button class="keypad-key" data-key="9" type="button">9</button>
            <button
              class="keypad-key"
              data-key="back"
              type="button"
              aria-label="Back"
            >
              ⌫
            </button>
            <button class="keypad-key" data-key="0" type="button">0</button>
            <span class="keypad-key" aria-hidden="true"></span>
          </div>
          <button
            class="primary-button full-width keypad-login"
            id="keypad-login"
            type="button"
          >
            Log In
          </button>
        </div>
        <p class="form-error" id="form-error" role="alert" hidden></p>
      </section>
    </main>
  </body>
  <script src="/frontend/src/app.js"></script>
</html>
