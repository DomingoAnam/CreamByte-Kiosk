<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fff1ec" />
    <title>Payment method · CreamByte</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/frontend/src/css/base.css" />
    <link
      rel="icon"
      type="image/png"
      href="/frontend/src/assets/creambyte-logo.png"
    />
    <link rel="stylesheet" href="/frontend/src/styles.css" />
    <link rel="stylesheet" href="/frontend/src/css/payment.css" />
    <script src="/frontend/src/app.js" defer></script>
  </head>
  <body data-page="payment">
    <header class="topbar">
      <a class="brand-link" href="/frontend/src/" aria-label="CreamByte home"
        ><img
          class="brand-mark"
          src="/frontend/src/assets/creambyte-logo.png"
          alt="CreamByte" /></a
      ><span class="language-pill"
        ><img
          class="language-icon"
          src="/frontend/src/assets/Globe.svg"
          alt="" />English<img
          class="language-caret"
          src="/frontend/src/assets/Dropdown.svg"
          alt=""
      /></span>
    </header>
    <main class="kiosk-main">
      <section class="panel payment-panel">
        <a
          class="back-button"
          href="/frontend/src/cart.html"
          aria-label="Go back"
          ><img src="/frontend/src/assets/Back Button.svg" alt=""
        /></a>
        <h1>Payment Method</h1>
        <div class="payment-options">
          <a
            class="payment-card"
            href="/frontend/src/confirmed.html"
            data-pay="counter"
            ><span aria-hidden="true">₱</span>Pay at the counter</a
          ><a
            class="payment-card"
            href="/frontend/src/cashless.html"
            data-pay="cashless"
            ><span aria-hidden="true">▣</span>Pay here (cashless)</a
          >
        </div>
        <div class="totals" id="payment-totals"></div>
      </section>
    </main>
  </body>
</html>
