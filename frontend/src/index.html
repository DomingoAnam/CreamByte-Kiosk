<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fff1ec" />
    <title>CreamByte Kiosk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/frontend/src/css/base.css" />
    <link
      rel="icon"
      type="image/png"
      href="/frontend/src/assets/creambyte-logo.png"
    />
    <link rel="stylesheet" href="/frontend/src/styles.css" />
    <link rel="stylesheet" href="/frontend/src/css/home.css" />
  </head>
  <body data-page="home">
    <header class="topbar">
      <a class="brand-link" href="/frontend/src/" aria-label="CreamByte home"
        ><img
          class="brand-mark"
          src="/frontend/src/assets/creambyte-logo.png"
          alt="CreamByte" /></a
      ><span class="language-pill"
        ><img
          class="language-icon"
          src="/frontend/src/assets/Globe.svg"
          alt="" />English<img
          class="language-caret"
          src="/frontend/src/assets/Dropdown.svg"
          alt=""
      /></span>
    </header>
    <main class="kiosk-main">
      <section class="panel home-panel">
        <div class="mascot-wrap">
          <span class="mascot-glow"></span
          ><img
            class="hero-mascot"
            src="/frontend/src/assets/CreamByte%20Bunny%20Mascot.svg"
            alt="CreamByte bunny mascot"
          />
        </div>
        <div class="home-content">
          <h1>A little scoop of happy</h1>
          <p>Make your CreamByte moment.</p>
          <button
            class="primary-button full-width"
            id="guest-start"
            type="button"
          >
            Order as guest <span aria-hidden="true">→</span></button
          ><button
            class="secondary-button full-width"
            id="member-login"
            type="button"
          >
            Member login</button
          ><a
            class="secondary-button full-width"
            href="/frontend/src/register.html"
            >Create an account</a
          >
        </div>
      </section>
    </main>
  </body>
  <script src="/frontend/src/app.js"></script>
</html>
